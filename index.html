    <!-- Apply the saved (or system) theme before first paint, so the page never
         flashes the wrong palette and React's first render matches the DOM. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#131211");
          }
        } catch (e) {
          /* localStorage blocked; fall through to the light default */
        }
      })();
    </script>
